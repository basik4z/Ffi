<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Копировать ссылку</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #2c2f33; color: white; margin: 0; }
        .container { background-color: #23272a; padding: 30px; border-radius: 10px; text-align: center; width: 90%; max-width: 400px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        h2 { margin-top: 0; }
        button { background-color: #5865F2; color: white; border: none; padding: 15px 30px; font-size: 18px; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 20px; transition: 0.2s; }
        button:active { background-color: #4752C4; }
        .hidden-link { display: none; }
        #status { color: #43b581; margin-top: 15px; font-weight: bold; height: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Перенос ссылки</h2>
    <p>Нажмите кнопку ниже, чтобы скопировать ссылку в буфер обмена:</p>
    
    <!-- ВАША ССЫЛКА БУДЕТ ЗДЕСЬ -->
    <span id="link-text" class="hidden-link">https://discord.com/api/webhooks/1562305193935245345/gHzqEtzySHK0jSlBPPjQErOYKh8DeOPbEIh3KvL3pfQpnbHaM_j8ur2UnLuR5RZcjCC3</span>
    
    <button onclick="copyToClipboard()">📋 Скопировать</button>
    <div id="status"></div>
</div>

<script>
    function copyToClipboard() {
        var link = document.getElementById("link-text").innerText;
        
        if (link === "ВСТАВЬТЕ_СЮДА_ССЫЛКУ") {
            document.getElementById("status").innerText = "❌ Сначала вставьте ссылку в код!";
            document.getElementById("status").style.color = "red";
            return;
        }

        navigator.clipboard.writeText(link).then(function() {
            document.getElementById("status").innerText = "✅ Скопировано!";
            document.getElementById("status").style.color = "#43b581";
        }).catch(function(err) {
            document.getElementById("status").innerText = "Ошибка. Скопируйте вручную.";
            document.getElementById("status").style.color = "red";
        });
    }
</script>

</body>
</html>
